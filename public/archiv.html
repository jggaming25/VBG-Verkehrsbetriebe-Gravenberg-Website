<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bildarchiv – VBG Verkehrsbetriebe Gravenberg</title>
<meta name="description" content="Bildarchiv der VBG Verkehrsbetriebe Gravenberg – Impressionen aus unserem fiktiven Roblox Bus-RP-Projekt."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e9e5b'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <div class="legal-wrap">
    <a class="legal-back" href="/">← Zurück zur Website</a>
    <h1>Bildarchiv</h1>
    <div id="gallery" class="gallery-grid" style="margin-top:10px"></div>
    <div id="gallery-empty" class="empty hidden" style="margin-top:14px">Keine Bilder vorhanden.</div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close icon-btn" id="lightbox-close" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="Bild"/>
  </div>

  <script>
    (async () => {
      let images = [];
      try { const r = await fetch('/api/images'); const d = await r.json(); images = d.images || []; } catch (e) {}
      const grid = document.getElementById('gallery');
      const empty = document.getElementById('gallery-empty');
      if (!images.length) { empty.classList.remove('hidden'); return; }
      grid.innerHTML = images.map((f) => `<div class="gallery-item" data-src="/IMGs/${encodeURIComponent(f)}"><img src="/IMGs/${encodeURIComponent(f)}" alt="Bild" loading="lazy"/></div>`).join('');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      grid.querySelectorAll('.gallery-item').forEach((it) => {
        it.addEventListener('click', () => { lightboxImg.src = it.dataset.src; lightbox.classList.remove('hidden'); });
      });
      document.getElementById('lightbox-close').addEventListener('click', () => { lightbox.classList.add('hidden'); lightboxImg.src = ''; });
      lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.add('hidden'); lightboxImg.src = ''; } });
    })();
  </script>
</body>
</html>
