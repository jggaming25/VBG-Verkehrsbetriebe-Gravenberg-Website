<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ticket-Archiv · VBG Gravenberg</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  body { min-height: 100vh; }
  .arch-wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  .arch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .arch-head h1 { font-size: 1.4rem; margin: 0; }
  .arch-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .arch-meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; }
  .arch-note { background: var(--warning-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px; color: var(--text); }
  .arch-msgs .msg { margin-bottom: 10px; }
  .arch-empty { color: var(--text-muted); }
  .arch-brand { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
  <nav class="nav"><div class="nav-inner" style="justify-content: space-between;">
    <button class="brand" onclick="location.href='/'">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/><path d="M4 17a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2M15 17a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2"/></svg>
      <span class="brand-text"><b>VBG</b><span class="brand-sub">Verkehrsbetriebe Gravenberg</span></span>
    </button>
    <a class="btn btn-primary" href="/">Zur Website</a>
  </div></nav>

  <main class="arch-wrap">
    <div id="arch-body" class="arch-empty">Lade Archiv …</div>
  </main>

  <footer class="footer"><div class="footer-inner"><span>© <span id="arch-year"></span> VBG Verkehrsbetriebe Gravenberg</span></div></footer>

<script>
  (function () {
    document.getElementById('arch-year').textContent = new Date().getFullYear();
    const token = new URLSearchParams(location.search).get('t') || location.pathname.split('/').filter(Boolean).pop() || '';
    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function fmt(dt) {
      const d = new Date(dt + (dt.includes('T') ? '' : 'T00:00:00'));
      return isNaN(d) ? String(dt) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    const cats = { frage: '❓ Frage', problem: '⚠️ Problem / Bug', vorschlag: '💡 Vorschlag', bewerbung: '📝 Bewerbung', sonstiges: '📦 Sonstiges' };

    function msgHtml(m) {
      if (m.is_system) return '<div class="msg-system">— ' + esc(m.message) + ' · ' + esc(fmt(m.created_at)).replace(', ', ' ') + ' —</div>';
      const staff = m.role !== 'besucher';
      return '<div class="msg ' + (staff ? 'msg-staff' : 'msg-user') + '">' +
        '<div class="msg-body">' +
        '<div class="msg-top"><b>' + esc(m.username) + '</b><span class="msg-time">' + esc(fmt(m.created_at)).replace(', ', ' · ') + '</span></div>' +
        (m.message ? '<p>' + esc(m.message) + '</p>' : '') +
        (m.attachment ? '<a href="' + esc(m.attachment) + '" target="_blank" rel="noopener"><img class="msg-img" src="' + esc(m.attachment) + '" alt="Anhang"/></a>' : '') +
        '</div></div>';
    }

    fetch('/api/archive/' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (d) {
        const t = d.ticket;
        const status = t.status === 'geschlossen' ? '<span class="badge badge-status-geschlossen">Geschlossen</span>' : '';
        const meta = [
          'VBG-' + String(t.id).padStart(4, '0'),
          cats[t.category] || t.category,
          'erstellt ' + fmt(t.created_at),
          t.user_name ? 'von ' + esc(t.user_name) : null,
          t.assignee_name ? '👤 ' + esc(t.assignee_name) : null
        ].filter(Boolean);
        $('arch-body').className = '';
        $('arch-body').innerHTML =
          '<div class="arch-head"><h1>' + esc(t.subject) + ' ' + status + '</h1></div>' +
          '<div class="arch-note">Dieses Ticket ist geschlossen und wurde über einen persönlichen Link aufgerufen.</div>' +
          '<div class="arch-card"><div class="arch-meta">' + meta.join('  ·  ') + '</div></div>' +
          '<div class="arch-card arch-msgs">' + (d.messages || []).map(msgHtml).join('') + '</div>';
      })
      .catch(function () {
        $('arch-body').innerHTML = '<div class="arch-card"><h2>Link ungültig</h2><p>Dieser Archiv-Link existiert nicht. Bitte den Link aus deiner Schließungs-E-Mail verwenden.</p><a class="btn btn-primary" href="/">Zur Website</a></div>';
      });
  })();
</script>
</body>
</html>
